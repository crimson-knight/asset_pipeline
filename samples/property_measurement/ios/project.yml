name: PropertyMeasurementFixture
options:
  bundleIdPrefix: com.assetpipeline.propertyfixture
  deploymentTarget:
    iOS: "17.0"
settings:
  EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  PropertyMeasurementFixture:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.assetpipeline.propertyfixture
      SWIFT_OBJC_BRIDGING_HEADER: Sources/PropertyFixture-Bridging-Header.h
      LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/build", "$(AP_NATIVE_DEPS_DIR)"]
      OTHER_LDFLAGS:
        - -lpropertyfixture
        - -lgc
        - -lpcre2-8
        - -liconv
        - -Wl,-force_load,$(PROJECT_DIR)/build/swiftkit_simulator.a
        - -framework SwiftUI
        - -framework Combine
        - -framework UIKit
        - -framework Foundation
        - -framework UserNotifications
        - -framework WebKit
        - -framework MapKit
        - -framework CoreLocation
        - -framework AVKit
        - -framework AVFoundation
        - -lobjc
  PropertyMeasurementFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: PropertyMeasurementFixture
    dependencies:
      - target: PropertyMeasurementFixture

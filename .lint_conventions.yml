# Phase 10A.0a + 10A.0b — Convention linter config.
#
# Read by `scripts/lint_conventions.cr` (and any rule that overrides
# `ConventionRule#configure`). Missing keys fall back to compiled-in
# defaults; passing `--config=<path>` overrides this file's location.

view_subclass:
  # Directory prefixes (repo-relative) under which a `< UI::View`
  # subclass may legally live. Files outside these roots that declare
  # a view subclass fire `family_1/view_subclass_under_views_dir`.
  approved_roots:
    - "src/ui/views/"
    - "samples/"

view_spec_pair:
  # Family 2 (Phase 10A.0b) tracked-debt allowlist. Each entry is a
  # repo-relative path to a view file that does NOT yet ship a paired
  # spec at `spec/web/ui/views/<basename>_spec.cr` (or the platform
  # equivalent). The rule `family_2/view_has_spec` skips these files.
  #
  # The list locks the current backlog so the rule stays green on
  # ToT. Adding a spec is a forward commit; remove the file's entry
  # in the same commit. Adding a NEW view without a spec must NOT
  # touch this allowlist — landing the spec is part of the same PR.
  #
  # As of Phase 10A.0b iter 1: 75 entries. Tracked as Phase 10A.final
  # follow-up work; see docs/initiative-cross-platform-ui/handoff/
  # phase-10-a-0b-close.md for the migration plan.

name: Apple native validation

'on':
  workflow_dispatch:
    inputs:
      report_selftest:
        description: 'Also open and close a self-test issue (lane:selftest) to prove the reporter tags the maintainers'
        type: boolean
        default: false
  schedule:
    # Nightly, half an hour after the Android lane. GitHub runs this from the
    # default branch only; the report job below opens the issue.
    - cron: '47 6 * * *'
  pull_request:
    paths:
      - 'src/**'
      - 'spec/**'
      - 'scripts/**'
      - 'swift/**'
      - 'samples/cross_platform/ios_host/**'
      - 'samples/cross_platform/macos_host/**'
      - 'config/android_toolchain.env'
      - 'shard.yml'
      - 'shard.lock'
      - 'Makefile'
      - '.github/workflows/apple-native.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'spec/**'
      - 'scripts/**'
      - 'swift/**'
      - 'samples/cross_platform/ios_host/**'
      - 'samples/cross_platform/macos_host/**'
      - 'config/android_toolchain.env'
      - 'shard.yml'
      - 'shard.lock'
      - 'Makefile'
      - '.github/workflows/apple-native.yml'

permissions:
  contents: read

concurrency:
  group: apple-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Apple ${{ matrix.role }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # 90 minutes: the first run on a fresh cache builds the fork compiler from
    # source (about half an hour); later runs restore its keg in seconds.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The standard macOS runners are free on public repositories. The
        # current image carries the shipping Xcode; the preview image carries
        # the next Xcode and OS betas, so the bindings meet them before they
        # ship. The deprecated 14 image must not return here.
        include:
          - runner: macos-26
            role: current
          - runner: xcode-27
            role: preview
    env:
      CRYSTAL_CACHE_DIR: ${{ github.workspace }}/build/crystal-cache/apple-ci
      CRYSTAL_CROSS_DEPS: ${{ github.workspace }}/build/apple-deps
      IOS_TEST_EVIDENCE: ${{ github.workspace }}/build/apple-ci/ios
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read canonical toolchain pins
        id: pins
        shell: bash
        run: |
          source config/android_toolchain.env
          source config/apple_toolchain.env
          printf 'crystal=%s\n' "$CRYSTAL_ANDROID_VERSION" >> "$GITHUB_OUTPUT"
          printf 'fork_tap=%s\nfork_formula=%s\nfork_version=%s\nfork_command=%s\n' \
            "$CRYSTAL_FORK_TAP" "$CRYSTAL_FORK_FORMULA" "$CRYSTAL_FORK_VERSION" "$CRYSTAL_FORK_COMMAND" >> "$GITHUB_OUTPUT"
      - name: Install pinned Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1 branch
        with:
          crystal: ${{ steps.pins.outputs.crystal }}
      - name: Install xcodegen and the autotools the C dependencies need
        # cross_compile_deps.sh runs bdwgc's autogen.sh (autoreconf) and pcre2's
        # cmake; the macOS images ship cmake but not autoconf, automake or libtool.
        shell: bash
        run: brew install xcodegen autoconf automake libtool
      - name: Restore the fork compiler keg
        # The tap formula has no bottle; the built keg is cached by the pinned
        # fork version and the image, and relinked below.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /opt/homebrew/Cellar/${{ steps.pins.outputs.fork_formula }}
          key: fork-keg-${{ matrix.runner }}-${{ steps.pins.outputs.fork_formula }}-${{ steps.pins.outputs.fork_version }}
      - name: Install the fork compiler (iOS and macOS targets)
        shell: bash
        env:
          FORK_TAP: ${{ steps.pins.outputs.fork_tap }}
          FORK_FORMULA: ${{ steps.pins.outputs.fork_formula }}
          FORK_VERSION: ${{ steps.pins.outputs.fork_version }}
          FORK_COMMAND: ${{ steps.pins.outputs.fork_command }}
        run: |
          brew tap "$FORK_TAP"
          if [ -d "/opt/homebrew/Cellar/$FORK_FORMULA/$FORK_VERSION" ]; then
            echo "restored keg $FORK_FORMULA $FORK_VERSION; installing its dependencies and relinking"
            brew install --only-dependencies "$FORK_TAP/$FORK_FORMULA"
            brew link --overwrite "$FORK_FORMULA"
          else
            echo "no keg for $FORK_FORMULA $FORK_VERSION; building the formula from source"
            brew install "$FORK_TAP/$FORK_FORMULA"
          fi
          "$FORK_COMMAND" --version
          "$FORK_COMMAND" --version | grep -F "Crystal 1.21.0"
      - name: Record the toolchain
        shell: bash
        run: |
          mkdir -p build/apple-ci
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
            xcrun simctl list devices available | grep -E 'iPhone .* Pro' || echo '(no iPhone Pro simulator listed)'
            crystal --version
            acrystal --version
            xcodegen --version
          } | tee build/apple-ci/toolchain.txt
      - name: Restore the cross-compiled C dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/apple-deps
          key: apple-deps-${{ matrix.runner }}-${{ hashFiles('scripts/cross_compile_deps.sh', 'scripts/android_env.sh', 'config/android_toolchain.env') }}
      - name: Shards install
        shell: bash
        run: shards install
      - name: Host contracts and web specs on macOS
        shell: bash
        run: |
          crystal spec spec/android_ci_spec.cr spec/apple_ci_spec.cr --error-trace
          make test-web
      - name: macOS host builds without signing
        shell: bash
        run: make -C samples/cross_platform/macos_host build CODESIGN_IDENTITY=- CRYSTAL=acrystal
      - name: iOS host behavior tests on the simulator
        shell: bash
        env:
          CRYSTAL: acrystal
        run: make test-ios
      - name: Verify tracked sources were not rewritten
        run: git diff --exit-code
      - name: Retain evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-native-${{ matrix.role }}-${{ matrix.runner }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/apple-ci/
  report:
    # Turns the matrix outcome into one issue that tags the maintainers, and
    # closes it on recovery. Pull requests carry their own checks, so this runs
    # for the scheduled, dispatched and push runs nobody is watching.
    name: Report the outcome
    needs: native
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Open, update or close the lane's issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.native.result }}
          LANE: apple-native
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          MAINTAINERS: ${{ vars.CI_MAINTAINERS }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/report_outcome.sh
      - name: Reporter self-test (dispatch input only)
        if: github.event_name == 'workflow_dispatch' && inputs.report_selftest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: selftest
          WORKFLOW_NAME: ${{ github.workflow }} (reporter self-test)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          MAINTAINERS: ${{ vars.CI_MAINTAINERS }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          OUTCOME=failure bash scripts/ci/report_outcome.sh
          OUTCOME=success bash scripts/ci/report_outcome.sh

# Voyager simulator-tap coordinate scenario.
#
# Maps accessibility_id (set via UI::View#test_id or
# UI::View#accessibility_identifier=) to HOST PIXEL coordinates captured
# against the simulator window's current pose + zoom. Coordinates are
# delivered via `cliclick c:<x>,<y>` from the harness. Re-capture via
# scripts/capture_tap_coordinates.sh whenever the simulator window moves
# or zooms.
#
# Pose: iPhone 17 Pro / iOS 26.5 portrait, simulator zoom level recorded
# at capture time.
#
# Phase 12.B Codex partial-review fix: IDs updated to match the real
# polish-branch test_ids (verified at the post-merge `phase-10-d-refocus`
# HEAD). See samples/initiative-cross-platform-ui-voyager/screens/todos_screen.cr.
#
# V1 path (action sheet auto-closes on swipe Share):
#   1. Long-press todo row → swipe trailing → Share tile fires
#      :request_share which sets state.pending_share_todo_id
#   2. Rerender wires UI::ConfirmationDialog as the share_sheet
#      (test_id: voyager-todos-share-sheet) with Copy/Print/Cancel actions
#   3. Owner-reported V1: action sheet opens, closes before interaction
#
# V2 path (overflow popover sort/hide/clear buttons):
#   1. Tap voyager-todos-overflow → opens Popover anchored to the button
#   2. Popover contains voyager-overflow-sort, voyager-overflow-hide-completed,
#      voyager-overflow-clear-completed
#   3. Owner-reported V2: tapping any of these three buttons crashes app

device: "iPhone 17 Pro"
runtime: "iOS 26.5"
orientation: portrait
captured_at: "2026-05-28T00:00:00Z"
captured_pose_sha: null  # not yet validator-enforced

taps:
  # ----- Todos screen — toolbar / overflow trigger ---------------------

  - id: "voyager-todos-print"
    x: 215
    y: 120
    description: "Print toolbar button (header)"
    captured: false  # PLACEHOLDER

  - id: "voyager-todos-settings"
    x: 300
    y: 120
    description: "Settings toolbar button (header)"
    captured: false  # PLACEHOLDER

  - id: "voyager-todos-overflow"
